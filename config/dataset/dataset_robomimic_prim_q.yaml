# robomimic: Panda target (K demos per task), IIWA / UR5e / Kinova3 sources; "_q" for stages 1-2, "_geo" for stage 3
data_config_suffix: "_q"
dataset_path:
  - ./demo_data/robomimic/processed/rs_panda
  - ./demo_data/robomimic/processed/rs_iiwa
  - ./demo_data/robomimic/processed/rs_ur5e
  - ./demo_data/robomimic/processed/rs_kinova3
embodiment_tag:
  - rs_panda_rel
  - rs_iiwa_rel
  - rs_ur5e_rel
  - rs_kinova3_rel
data_config:
  - rs_panda_rel_prim${dataset.data_config_suffix}
  - rs_iiwa_rel_prim${dataset.data_config_suffix}
  - rs_ur5e_rel_prim${dataset.data_config_suffix}
  - rs_kinova3_rel_prim${dataset.data_config_suffix}
video_backend:
  - decord
  - decord
  - decord
  - decord

modifiy_tasks_num:
  - "Lift the cube.": ${K}
    "Pick up the can and place it in the bin.": ${K}
    "Pick up the square nut and put it on the square peg.": ${K}
  - null
  - null
  - null

drop_video: false
frame_cache_root: ./demo_data/robomimic/frame_cache

window_size: ${window_size}
sampling_weights: null
batch_size: ${batch_size}
num_workers: 16
prefetch_factor: 1
pin_memory: false
drop_last: true
persistent_workers: false
shuffle: true
balance_tasks: ${balance_tasks}
collator:
  normalize_images: true
